[project]
name = "griptape-nodes-library-corridorkey"
version = "0.3.0"
description = "Griptape Nodes library wrapping the CorridorKey neural green/blue screen keying model."
authors = [{ name = "Griptape, Inc.", email = "hello@griptape.ai" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "numpy",
    "Pillow",
]

[tool.uv.sources]
griptape-nodes-engine = { git = "https://github.com/griptape-ai/griptape-nodes-engine", rev = "stable" }


[project.optional-dependencies]
# Execution-time only: the engine installs these into <library>/.venv-exec and puts
# them on sys.path solely inside this library's worker process. They are absent from
# the machine that only edits workflows, which is the point.
exec = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "timm==1.0.24",
    "safetensors",
    "opencv-python>=5.0.0.93",
    "tqdm",
    "huggingface-hub",
    "transformers",
    "diffusers",
    "accelerate",
    "peft",
    "einops",
    "kornia",
    "PIMS",
    "easydict",
    "imageio",
    "matplotlib",
    "av",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["griptape_nodes_library_corridorkey"]

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest", "griptape-nodes-engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
  ".venv",
  "**/node_modules",
  "**/__pycache__",
  "griptape_nodes_library_corridorkey/CorridorKey",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates", "griptape_nodes_library_corridorkey/CorridorKey"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
reportMissingImports = false
reportMissingModuleSource = false
